<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Prisha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Comic+Neue:wght@700&family=Quicksand:wght@500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        :root {
            --rose: #ff4f9a;
            --coral: #ff7a6b;
            --lavender: #8b5cf6;
            --ink: #3b294a;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.82) 0 9%, transparent 10%),
                linear-gradient(135deg, #ffe4ec 0%, #e9f6ff 38%, #fff0d7 72%, #f4e8ff 100%);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            padding: clamp(1rem, 4vw, 2.2rem);
            color: var(--ink);
        }

        .custom-cursor {
            width: 30px;
            height: 30px;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s;
        }

        .custom-cursor svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 5px rgba(255, 182, 193, 0.5));
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .page-kicker {
            display: inline-flex;
            margin: 0 auto 1rem;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: #7c2d12;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        h1 {
            max-width: 820px;
            margin: 0 auto 1.5rem;
            font-family: 'Bubblegum Sans', cursive;
            font-size: clamp(2.4rem, 7vw, 5rem);
            line-height: 0.96;
            color: var(--rose);
            text-shadow: 2px 8px 24px rgba(255, 79, 154, 0.18);
        }

        .portrait-strip {
            width: min(880px, 100%);
            min-height: 232px;
            margin: 0 auto 1.6rem;
            display: grid;
            grid-template-columns: 0.85fr 1fr 0.85fr;
            align-items: end;
            gap: clamp(0.55rem, 2vw, 1.1rem);
        }

        .portrait-strip img {
            width: 100%;
            height: clamp(190px, 35vw, 310px);
            object-fit: cover;
            object-position: center 22%;
            border: 8px solid rgba(255, 255, 255, 0.92);
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(63, 34, 83, 0.17);
        }

        .portrait-strip img:nth-child(1) {
            transform: rotate(-4deg);
        }

        .portrait-strip img:nth-child(2) {
            height: clamp(230px, 43vw, 370px);
        }

        .portrait-strip img:nth-child(3) {
            transform: rotate(4deg);
        }

        #reasons-container {
            display: grid;
            gap: 1rem;
        }

        .reason-card {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 8px;
            padding: 1.35rem;
            box-shadow: 0 14px 34px rgba(63, 34, 83, 0.12);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .reason-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(255, 79, 154, 0.2);
        }

        .reason-text {
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.7;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        .gif-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }

        .gif-overlay img {
            max-width: 160px;
            max-height: 160px;
            object-fit: contain;
        }

        .reason-card:hover .gif-overlay {
            opacity: 1;
        }

        .shuffle-button {
            min-height: 54px;
            background: linear-gradient(135deg, var(--rose), var(--coral));
            border: 0;
            border-radius: 999px;
            padding: 0 1.55rem;
            font-size: 1.05rem;
            color: #fff;
            margin: 1.7rem 0 0.6rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            box-shadow: 0 14px 28px rgba(255, 79, 154, 0.28);
        }

        .shuffle-button.story-mode {
            background: linear-gradient(135deg, var(--lavender), var(--rose));
            transform: scale(1.05);
        }

        .shuffle-button:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .shuffle-button.story-mode:hover {
            transform: translateY(-2px) scale(1.1);
        }

        .reason-counter {
            font-size: 0.92rem;
            color: #7b6688;
            min-height: 1.2rem;
            font-weight: 700;
        }

        .floating {
            position: fixed;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
            z-index: 5;
        }

        .ending-section {
            display: grid;
            place-items: center;
            gap: 1rem;
            margin-top: 3rem;
            padding-bottom: 2rem;
        }

        .ending-text {
            font-family: 'Bubblegum Sans', cursive;
            font-size: clamp(1.7rem, 5vw, 2.6rem);
            color: var(--rose);
            opacity: 0;
            transform: translateY(20px);
        }

        .ending-photo {
            width: min(260px, 72vw);
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 10px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 45px rgba(63, 34, 83, 0.18);
            transform: scale(0);
        }

        .ending-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 760px) {
            * {
                cursor: auto;
            }

            .custom-cursor {
                display: none;
            }

            .portrait-strip {
                grid-template-columns: repeat(3, 1fr);
                min-height: 0;
            }

            .portrait-strip img {
                height: clamp(150px, 42vw, 230px);
                border-width: 6px;
                border-radius: 8px;
            }

            .portrait-strip img:nth-child(2) {
                height: clamp(180px, 52vw, 275px);
            }
        }

        @media (max-width: 520px) {
            body {
                padding-inline: 0.85rem;
            }

            .portrait-strip {
                gap: 0.35rem;
            }

            .shuffle-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#ff4f9a" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <main class="container">
        <p class="page-kicker">A few reasons before 15 May arrives</p>
        <h1>Prisha, You Make Everything Sweeter</h1>

        <div class="portrait-strip" aria-label="Prisha photo highlights">
            <img src="d1.jpeg" alt="Prisha birthday portrait">
            <img src="d2.jpeg" alt="Prisha happy moment">
            <img src="d3.jpeg" alt="Prisha special memory">
        </div>

        <section id="reasons-container" aria-live="polite"></section>

        <button class="shuffle-button" type="button">Show One More</button>
        <div class="reason-counter"></div>

        <section class="ending-section">
            <div class="ending-photo">
                <img src="d1.jpeg" alt="Prisha">
            </div>
            <div class="ending-text">My favorite person, my Prisha</div>
        </section>
    </main>

    <script>
        const reasons = [
            {
                text: "Prisha, your smile can make an ordinary day feel special.",
                emoji: "💖",
                gif: "gif1.gif"
            },
            {
                text: "You are soft-hearted, beautiful, and full of the kind of warmth I always want close.",
                emoji: "🌸",
                gif: "gif2.gif"
            },
            {
                text: "I love the way you make tiny moments feel like memories worth keeping.",
                emoji: "✨",
                gif: "gif1.gif"
            },
            {
                text: "On 15 May, I want you to feel loved, celebrated, and reminded that you are my favorite person.",
                emoji: "🎂",
                gif: "gif2.gif"
            }
        ];

        let currentReasonIndex = 0;
        let isTransitioning = false;

        const reasonsContainer = document.getElementById('reasons-container');
        const shuffleButton = document.querySelector('.shuffle-button');
        const reasonCounter = document.querySelector('.reason-counter');
        const cursor = document.querySelector('.custom-cursor');

        function fadeOutTo(url, duration = 750) {
            const animation = document.body.animate(
                [{ opacity: 1 }, { opacity: 0 }],
                { duration, easing: 'ease', fill: 'forwards' }
            );

            animation.onfinish = () => {
                window.location.href = url;
            };
        }

        function createReasonCard(reason) {
            const card = document.createElement('div');
            card.className = 'reason-card';

            const text = document.createElement('div');
            text.className = 'reason-text';
            text.textContent = `${reason.emoji} ${reason.text}`;

            const gifOverlay = document.createElement('div');
            gifOverlay.className = 'gif-overlay';
            gifOverlay.innerHTML = `<img src="${reason.gif}" alt="">`;

            card.appendChild(text);
            card.appendChild(gifOverlay);

            return card;
        }

        function revealReasonCard(card) {
            card.animate(
                [
                    { opacity: 0, transform: 'translateY(42px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ],
                {
                    duration: 480,
                    easing: 'cubic-bezier(.34, 1.56, .64, 1)'
                }
            );
        }

        function prepareStoryButton() {
            shuffleButton.getAnimations().forEach((animation) => animation.cancel());
            shuffleButton.textContent = 'See Our Memories';
            shuffleButton.classList.add('story-mode');
            reasonCounter.textContent = 'All reasons unlocked for Prisha';
        }

        function displayNewReason() {
            if (isTransitioning) return;

            if (currentReasonIndex >= reasons.length) {
                fadeOutTo('last.html');
                return;
            }

            isTransitioning = true;
            const card = createReasonCard(reasons[currentReasonIndex]);
            reasonsContainer.appendChild(card);
            revealReasonCard(card);

            currentReasonIndex += 1;
            reasonCounter.textContent = `${currentReasonIndex} / ${reasons.length}`;
            createFloatingElement();

            if (currentReasonIndex === reasons.length) {
                const buttonAnimation = shuffleButton.animate(
                    [
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.05)' }
                    ],
                    {
                        duration: 450,
                        easing: 'cubic-bezier(.34, 1.56, .64, 1)',
                        fill: 'forwards'
                    }
                );

                buttonAnimation.onfinish = prepareStoryButton;

                document.querySelector('.ending-photo').animate(
                    [
                        { transform: 'scale(0)' },
                        { transform: 'scale(1)' }
                    ],
                    {
                        duration: 800,
                        easing: 'cubic-bezier(.34, 1.56, .64, 1)',
                        fill: 'forwards'
                    }
                );

                document.querySelector('.ending-text').animate(
                    [
                        { opacity: 0, transform: 'translateY(20px)' },
                        { opacity: 1, transform: 'translateY(0)' }
                    ],
                    {
                        duration: 700,
                        delay: 250,
                        easing: 'ease',
                        fill: 'forwards'
                    }
                );
            }

            setTimeout(() => {
                isTransitioning = false;
            }, 500);
        }

        function pulseButton() {
            const baseScale = shuffleButton.classList.contains('story-mode') ? 'scale(1.05)' : 'scale(1)';

            shuffleButton.animate(
                [
                    { transform: baseScale },
                    { transform: 'scale(0.93)' },
                    { transform: baseScale }
                ],
                {
                    duration: 160,
                    easing: 'ease'
                }
            );
        }

        shuffleButton.addEventListener('click', () => {
            pulseButton();
            displayNewReason();
        });

        function createFloatingElement() {
            const elements = ['🌸', '✨', '💖', '🎂', '💕', '⭐'];
            const element = document.createElement('div');
            const duration = Math.random() * 6000 + 7000;

            element.className = 'floating';
            element.textContent = elements[Math.floor(Math.random() * elements.length)];
            element.style.left = `${Math.random() * window.innerWidth}px`;
            element.style.top = `${Math.random() * window.innerHeight}px`;
            element.style.fontSize = `${Math.random() * 20 + 12}px`;
            document.body.appendChild(element);

            const animation = element.animate(
                [
                    { opacity: 1, transform: 'translateY(0)' },
                    { opacity: 0, transform: 'translateY(-480px)' }
                ],
                { duration, easing: 'ease' }
            );

            animation.onfinish = () => element.remove();
        }

        document.addEventListener('mousemove', (event) => {
            if (!cursor) return;
            cursor.style.transform = `translate(${event.clientX - 15}px, ${event.clientY - 15}px)`;
        });

        document.querySelectorAll('.portrait-strip img').forEach((image, index) => {
            const finalTransform = getComputedStyle(image).transform;
            const baseTransform = finalTransform === 'none' ? '' : finalTransform;

            image.animate(
                [
                    { opacity: 0, transform: `${baseTransform} translateY(28px)` },
                    { opacity: 1, transform: baseTransform || 'none' }
                ],
                {
                    duration: 700,
                    delay: index * 120,
                    easing: 'cubic-bezier(.2,.8,.2,1)',
                    fill: 'backwards'
                }
            );
        });

        setInterval(createFloatingElement, 2200);
    </script>
</body>
</html>
